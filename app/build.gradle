plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edition.desktop'
    compileSdk 33

    // Chave fixa do projeto: todas as builds ficam assinadas com a mesma chave, e por isso o
    // Android aceita instalar uma versão por cima da anterior (sem conflito de assinatura).
    signingConfigs {
        debug {
            storeFile file('launcher-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.edition.desktop'
        minSdk 23
        // 33 mantém compatibilidade com AGP 7.4.2. Para subir para 34, atualiza o AGP para 8.x.
        targetSdk 33
        // No CI, o número de cada execução do workflow torna o versionCode sempre crescente
        // (1000 + GITHUB_RUN_NUMBER). Assim, uma build nova nunca é uma "descida" de versão.
        versionCode (1000 + (System.getenv('GITHUB_RUN_NUMBER') ?: '11').toInteger())
        versionName '2.4'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
