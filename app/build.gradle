plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edition.desktop'
    compileSdk 33

    defaultConfig {
        applicationId 'com.edition.desktop'
        minSdk 23
        // 33 mantém compatibilidade com AGP 7.4.2. Para subir para 34, atualiza o AGP para 8.x.
        targetSdk 33
        versionCode 11
        versionName '2.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
